# SpeedHub Release Pipeline
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      - name: Publish Windows x64
        run: |
          dotnet publish src/SpeedHub.Cli/SpeedHub.Cli.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -o publish/win-x64
      
      - name: Create ZIP
        run: |
          Compress-Archive -Path publish/win-x64/* -DestinationPath SpeedHub-win-x64.zip
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: speedhub-win-x64
          path: SpeedHub-win-x64.zip

  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      - name: Publish Linux x64
        run: |
          dotnet publish src/SpeedHub.Cli/SpeedHub.Cli.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:EnableCompressionInSingleFile=true \
            -o publish/linux-x64
      
      - name: Create tarball
        run: |
          cd publish/linux-x64
          tar -czf ../../SpeedHub-linux-x64.tar.gz *
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: speedhub-linux-x64
          path: SpeedHub-linux-x64.tar.gz

  create-release:
    name: Create GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: speedhub-win-x64
          path: artifacts/win
      
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: speedhub-linux-x64
          path: artifacts/linux
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/win/SpeedHub-win-x64.zip
            artifacts/linux/SpeedHub-linux-x64.tar.gz
          draft: false
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
